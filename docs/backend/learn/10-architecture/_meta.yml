name: "架构与领域设计"
icon: "🏛️"
order: 10
description: "设计模式、分层、DDD 与 API 设计"
teach:
  audience: "写过业务模块、需要划分边界的开发者"
  prerequisites:
    - "能读写 Python 类与模块"
    - "了解分层与接口的基本概念"
    - "写过一个完整的 HTTP 服务"
  outcomes:
    - "能按变化方向选择设计模式"
    - "能划清分层边界与依赖方向"
    - "能建模实体、值对象与聚合"
    - "能设计稳定的 REST 接口与版本策略"
  path:
    - from: "01-pattern-selection"
      to: "05-layering"
      label: "模式语言"
    - from: "06-dependency-injection"
      to: "10-api-evolution"
      label: "边界与契约"
  lessons:
    - slug: "01-pattern-selection"
      goal: "讲清 Python 惯用写法与模式取舍"
    - slug: "02-creational-patterns"
      goal: "讲清工厂、单例与注册表的用法"
    - slug: "03-structural-patterns"
      goal: "讲清适配器、装饰器与代理边界"
    - slug: "04-behavioral-patterns"
      goal: "讲清策略、责任链与观察者"
    - slug: "05-layering"
      goal: "讲清分层边界与依赖倒置"
    - slug: "06-dependency-injection"
      goal: "讲清手工装配与容器注入"
    - slug: "07-domain-modeling"
      goal: "讲清实体、值对象与聚合边界"
    - slug: "08-ddd-repository"
      goal: "讲清仓储、领域服务与领域事件"
    - slug: "09-api-design"
      goal: "讲清 REST 与 RPC 的建模与错误语义"
    - slug: "10-api-evolution"
      goal: "讲清版本策略、幂等与兼容窗口"
