name: "并发编程"
order: 1
icon: "⚡"
description: "线程、进程、队列与异步 I/O"
teach:
  audience: "有 Python 语法基础、准备中高级后端面试的开发者"
  prerequisites:
    - "能读写 Python 函数与类"
    - "了解进程与线程的基本概念"
    - "能用命令行运行 Python 脚本"
  outcomes:
    - "能解释 GIL 的让出点并据此选择线程、进程或协程"
    - "能用锁、条件变量与信号量组织线程协作"
    - "能用执行器编排任务并处理超时与异常"
    - "能按数据体积选择跨进程传递方式"
    - "能定位并发卡死并写出可靠的异步流程"
  path:
    - from: "01-thread-basics"
      to: "03-queue-pipe"
      label: "线程与进程基础"
    - from: "04-async-io"
      to: "06-sync-primitives"
      label: "异步与协作"
    - from: "07-executor-pools"
      to: "09-async-advanced"
      label: "工程化并发"
    - from: "10-subprocess-signals"
      to: "12-asyncio-thread-bridge"
      label: "系统集成与定位"
  lessons:
    - slug: "01-thread-basics"
      goal: "讲清线程创建、锁与 GIL 的关系"
    - slug: "02-process-basics"
      goal: "讲清进程启动方式与跨进程数据传递"
    - slug: "03-queue-pipe"
      goal: "讲清队列、哨兵与消费者的优雅退出"
    - slug: "04-async-io"
      goal: "讲清事件循环、协程与限流边界"
    - slug: "05-gil-internals"
      goal: "讲清 GIL 的三条让出路径与选型结论"
    - slug: "06-sync-primitives"
      goal: "讲清锁家族分工与死锁排查办法"
    - slug: "07-executor-pools"
      goal: "讲清执行器与 Future 的取值边界"
    - slug: "08-shared-memory"
      goal: "讲清共享内存的零拷贝与同步代价"
    - slug: "09-async-advanced"
      goal: "讲清任务组、超时与背压的写法"
    - slug: "10-subprocess-signals"
      goal: "讲清命令树超时清理与信号处理"
    - slug: "11-concurrency-debugging"
      goal: "讲清用栈与指标定位并发问题"
    - slug: "12-asyncio-thread-bridge"
      goal: "讲清线程与事件循环的安全交接"
