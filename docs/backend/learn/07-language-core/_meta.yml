name: "语言核心机制"
icon: "🧬"
order: 7
description: "数据模型、元类、描述符、异常与导入机制"
teach:
  audience: "写过类与装饰器、想补齐语言机制的开发者"
  prerequisites:
    - "能读写 Python 类与函数"
    - "用过装饰器与生成器"
    - "了解对象与属性的基本用法"
  outcomes:
    - "能解释属性查找与描述符的调用顺序"
    - "能用元类或 __init_subclass__ 约束子类"
    - "能按协议实现迭代、上下文与比较"
    - "能设计清晰的异常层次与异常组"
    - "能排查导入失败与循环导入"
  path:
    - from: "01-data-model"
      to: "05-metaclass"
      label: "对象与属性"
    - from: "06-decorators-closures"
      to: "10-modules-import"
      label: "协议与工程"
  lessons:
    - slug: "01-data-model"
      goal: "讲清魔术方法与协议的调用时机"
    - slug: "02-object-lifecycle"
      goal: "讲清对象创建、初始化与销毁"
    - slug: "03-attribute-access"
      goal: "讲清属性查找顺序与 __slots__ 代价"
    - slug: "04-descriptors"
      goal: "讲清描述符协议与属性代理"
    - slug: "05-metaclass"
      goal: "讲清元类创建类对象的流程"
    - slug: "06-decorators-closures"
      goal: "讲清闭包捕获与装饰器叠加顺序"
    - slug: "07-context-managers"
      goal: "讲清 with 协议与资源释放时机"
    - slug: "08-iterators-generators"
      goal: "讲清迭代协议与生成器暂停恢复"
    - slug: "09-exceptions"
      goal: "讲清异常层次、链式传递与异常组"
    - slug: "10-modules-import"
      goal: "讲清导入查找、缓存与循环导入"
