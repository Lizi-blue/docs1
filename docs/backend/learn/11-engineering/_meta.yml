name: "工程化与交付"
icon: "🧰"
order: 11
description: "配置、日志、测试、依赖治理与可回滚发布"
teach:
  audience: "负责服务交付、要建立工程规范的开发者"
  prerequisites:
    - "能读写 Python 项目与依赖文件"
    - "用过日志与命令行排查问题"
    - "写过一个可运行的测试"
  outcomes:
    - "能分层管理配置与密钥"
    - "能设计结构化日志与告警指标"
    - "能按测试金字塔分配用例"
    - "能治理依赖并锁定构建"
    - "能做出可回滚的容器发布"
  path:
    - from: "01-config-management"
      to: "04-observability"
      label: "运行支撑"
    - from: "05-unit-testing"
      to: "10-deploy-container"
      label: "交付链路"
  lessons:
    - slug: "01-config-management"
      goal: "讲清分层配置与环境覆盖顺序"
    - slug: "02-secrets"
      goal: "讲清密钥托管、轮换与最小权限"
    - slug: "03-logging"
      goal: "讲清日志字段、级别与上下文传递"
    - slug: "04-observability"
      goal: "讲清指标、链路与告警的配合"
    - slug: "05-unit-testing"
      goal: "讲清测试边界与夹具设计"
    - slug: "06-integration-contract"
      goal: "讲清集成测试与契约测试分工"
    - slug: "07-property-testing"
      goal: "讲清属性测试与生成式用例"
    - slug: "08-packaging"
      goal: "讲清打包、锁文件与依赖治理"
    - slug: "09-code-quality"
      goal: "讲清 lint、格式与评审门禁"
    - slug: "10-deploy-container"
      goal: "讲清镜像、健康检查与回滚"
