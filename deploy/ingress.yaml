apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${DEPLOYMENT_NAME}
  namespace: ${K8S_NAMESPACE}
spec:
  # 通配符证书 *.minilab.uzibird.cn 由 Traefik 全局 file provider 提供，
  # 按 SNI 自动下发，这里只声明域名。
  tls:
    - hosts:
        - ${INGRESS_HOST}
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${DEPLOYMENT_NAME}
                port:
                  number: 80
